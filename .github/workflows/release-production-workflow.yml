name: Release plugin to production

on:
  pull_request:
    types:
      - closed
    branches:
      - 'main'
      # - 'dev/add-release-workflow'

permissions:
  contents: write

jobs:
  Deploy-To-Production:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/')
    runs-on: [ios, self-hosted]
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: PR branch check
      uses: mdecoleman/pr-branch-name@0eff30e02b3234b740e7610b17f270b2e747dad1 # 1.2.0
      id: vars
      with:
        repo-token: ${{ secrets.CI_GITHUB_TOKEN }}       
    - name: Determine release tag and release branch
      env:
        BRANCH: ${{ steps.vars.outputs.branch }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        TAG=$(echo "$BRANCH" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
        if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid release version extracted from branch name" >&2
          exit 1
        fi
        echo "PLUGIN_VERSION=$TAG" >> "$GITHUB_ENV"
        echo "push new release >> $TAG"
        echo "from branch: $HEAD_REF"
    - name: Create release and tag
      env:
        TAG: ${{env.PLUGIN_VERSION}}
      uses: "actions/github-script@211cb3fefb35a799baa5156f9321bb774fe56294" # v5
      with:
        script: |
          try {
            await github.rest.repos.createRelease({
              draft: false,
              generate_release_notes: false,
              name: process.env.TAG,
              owner: context.repo.owner,
              prerelease: false,
              repo: context.repo.repo,
              tag_name: process.env.TAG
            });
          } catch (error) {
            core.setFailed(error.message);
          }     
    - name: Push to COCOAPODS
      run: |
        pod trunk me
        pod trunk push AppsFlyerAdobeAEPExtension.podspec
    - name: Notify with SLack
      uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
      with:
        payload: |
          {
            "appsflyer_version": "${{env.PLUGIN_VERSION}}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}    
